[package]
name = "miahub"
version = "0.2.0"
edition = "2021"
description = "MiaHUB — open-source AULA keyboard manager (F3009 / F2087Pro)"
authors = ["shengengfun"]
license = "MIT"

[lib]
name = "miahub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
